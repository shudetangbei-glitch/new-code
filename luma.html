    function clearSession(){token="";refreshToken="";localStorage.removeItem("luma_access_token");localStorage.removeItem("luma_refresh_token");el("accountButton").innerHTML="浣撻獙鐢ㄦ埛<br><small>鐧诲綍鍚庡彲浣跨敤鑷繁鐨勮处鍙?/small>"}

    }

        recorder=new MediaRecorder(mediaStream,mime?{mimeType:mime}:undefined);recordingChunks=[];heardSpeech=false;silenceSince=0;

          try{const body=new FormData();body.append("audio",new Blob(chunks,{type:current.mimeType||"audio/webm"}),"voice.webm");const configuredEndpoint=ASR_ENDPOINT.replace(/\/$/,"");const response=await fetch(configuredEndpoint.endsWith("/asr")?configuredEndpoint:configuredEndpoint+"/asr",{method:"POST",body});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||"璇煶璇嗗埆鏈嶅姟鏆傛椂涓嶅彲鐢?);const text=(data.text||"").trim();if(!text){setStatus("娌℃湁鍚竻锛岃鍐嶈涓€娆?,true);if(voiceActive)setTimeout(listen,350);return}el("input").value=text;render();setStatus("宸茶瘑鍒紝Luma 姝ｅ湪鍥炵瓟鈥?);send(text,true)}catch(error){setStatus(error.message||"璇煶璇嗗埆澶辫触锛岃绋嶅悗閲嶈瘯",true)}

        audioContext=new AudioContext();const analyser=audioContext.createAnalyser();analyser.fftSize=1024;audioContext.createMediaStreamSource(mediaStream).connect(analyser);const samples=new Uint8Array(analyser.fftSize),started=Date.now();

    el("newChat").onclick=()=>{messages=[starter];save();render()};
    el("accountButton").onclick=()=>{el("loginModal").classList.add("open")};el("closeLogin").onclick=()=>el("loginModal").classList.remove("open");
    el("switchMode").onclick=()=>{signup=!signup;el("loginTitle").textContent=signup?"鍒涘缓璐﹀彿":"鐧诲綍 Luma";el("loginSubmit").textContent=signup?"娉ㄥ唽骞剁櫥褰?:"鐧诲綍";el("switchMode").textContent=signup?"宸叉湁璐﹀彿锛熻繑鍥炵櫥褰?:"娌℃湁璐﹀彿锛熺珛鍗虫敞鍐?;el("loginError").textContent=""};
    el("loginForm").onsubmit=async e=>{e.preventDefault();el("loginError").textContent="";const endpoint=signup?SUPABASE_URL+"/auth/v1/signup":SUPABASE_URL+"/auth/v1/token?grant_type=password";try{const r=await fetch(endpoint,{method:"POST",headers:{apikey:SUPABASE_KEY,"content-type":"application/json"},body:JSON.stringify({email:el("email").value.trim(),password:el("password").value})});const data=await r.json();if(!r.ok||!data.access_token)throw new Error(data.msg||data.error_description||"鐧诲綍澶辫触");storeSession(data);el("accountButton").innerHTML=`${escapeHtml(el("email").value.trim().split("@")[0])}<br><small>宸茬櫥褰?/small>`;el("loginModal").classList.remove("open")}catch(error){el("loginError").textContent=error.message}};
    if(token)el("accountButton").innerHTML="宸茬櫥褰?br><small>璐﹀彿璁板繂灏嗗湪鍚庣画鍚屾</small>";render();
  </script>
