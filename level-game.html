<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <title>星点突围</title>
  <style>
    :root {
      --ink: #ecf2ff;
      --muted: #96a7c2;
      --page: #101722;
      --surface: #172131;
      --line: #2d3a4f;
      --cyan: #55d6d3;
      --gold: #ffd166;
      --coral: #ff6f7d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background: var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
    }
    .shell { width: min(100% - 28px, 940px); margin: 0 auto; padding: 28px 0 42px; }
    .masthead { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: .02em; }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
    .level-badge { padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px; color: var(--cyan); font-weight: 750; white-space: nowrap; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 16px; align-items: start; }
    .game-wrap { position: relative; }
    canvas {
      display: block; width: 100%; height: min(68vh, 560px); min-height: 410px;
      border: 1px solid var(--line); border-radius: 8px; background: #0b111a; touch-action: manipulation;
    }
    .hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .stat { border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; background: var(--surface); }
    .stat span { display: block; }
    .label { color: var(--muted); font-size: 11px; }
    .value { margin-top: 2px; font-size: 20px; font-weight: 760; }
    .overlay {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 18px;
      background: rgba(10, 16, 25, .73); border-radius: 8px;
    }
    .overlay[hidden] { display: none; }
    .dialog { width: min(100%, 350px); padding: 24px; border: 1px solid var(--line); border-radius: 8px; background: #172131; text-align: center; }
    .dialog h2 { margin: 0 0 9px; font-size: 24px; }
    .dialog p { margin: 0 0 17px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    button, input { font: inherit; }
    button { border: 0; border-radius: 7px; cursor: pointer; font-weight: 750; }
    .primary { min-height: 44px; padding: 0 18px; background: var(--cyan); color: #081215; }
    .primary:hover { filter: brightness(1.07); }
    .record-form { display: flex; gap: 7px; margin: 0 0 12px; }
    .record-form[hidden] { display: none; }
    input { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 7px; background: #0f1723; color: var(--ink); padding: 0 10px; outline: none; }
    input:focus { border-color: var(--cyan); }
    .save { min-width: 62px; background: var(--gold); color: #251a00; }
    .board { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 15px; }
    .board h2 { margin: 0 0 4px; font-size: 16px; }
    .board p { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    ol { margin: 0; padding: 0; list-style: none; }
    li { display: grid; grid-template-columns: 22px 1fr auto; gap: 7px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .rank { color: var(--gold); font-weight: 750; }
    .entry-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .entry-score { color: var(--cyan); font-weight: 750; }
    .hint { margin: 12px 2px 0; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 18px, 940px); padding-top: 18px; }
      .masthead { display: block; }
      .level-badge { display: inline-block; margin-top: 13px; }
      .layout { grid-template-columns: 1fr; }
      .board { order: 2; }
      canvas { height: 56vh; min-height: 390px; }
    }
    @media (max-width: 430px) {
      .hud { gap: 6px; }
      .stat { padding: 8px 7px; }
      .value { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <h1>星点突围</h1>
        <p class="subtitle">命中目标，穿过五个越来越快的关卡。</p>
      </div>
      <div class="level-badge" id="levelBadge">第 1 关 / 5</div>
    </header>

    <div class="layout">
      <section class="game-wrap">
        <div class="hud" aria-label="游戏数据">
          <div class="stat"><span class="label">本关目标</span><span class="value" id="goal">0/0</span></div>
          <div class="stat"><span class="label">倒计时</span><span class="value" id="time">0</span></div>
          <div class="stat"><span class="label">生命</span><span class="value" id="lives">0</span></div>
          <div class="stat"><span class="label">总分</span><span class="value" id="score">0</span></div>
        </div>
        <canvas id="game" aria-label="星点突围游戏区域"></canvas>
        <div class="overlay" id="overlay">
          <div class="dialog">
            <h2 id="dialogTitle">准备闯关</h2>
            <p id="dialogText">点击或轻触移动的星点。蓝色目标 1 分，金色目标 2 分；点空会损失生命。</p>
            <div class="record-form" id="recordForm" hidden>
              <input id="nameInput" maxlength="12" placeholder="输入昵称">
              <button class="save" id="saveBtn" type="button">保存</button>
            </div>
            <button class="primary" id="startBtn" type="button">开始游戏</button>
          </div>
        </div>
        <p class="hint">手机直接轻触目标即可；排行榜只保存在当前设备。</p>
      </section>

      <aside class="board">
        <h2>本机排行榜</h2>
        <p>保存当前浏览器中的前五名成绩。</p>
        <ol id="leaderboard"></ol>
      </aside>
    </div>
  </main>

  <script>
    (() => {
      const stages = [
        { goal: 8, time: 22, lives: 4, radius: 28, speed: 115 },
        { goal: 11, time: 22, lives: 4, radius: 25, speed: 145 },
        { goal: 14, time: 21, lives: 3, radius: 22, speed: 180 },
        { goal: 17, time: 20, lives: 3, radius: 19, speed: 220 },
        { goal: 21, time: 19, lives: 3, radius: 17, speed: 265 }
      ];
      const storageKey = "star-breakout-leaderboard-v1";
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const levelBadge = document.getElementById("levelBadge");
      const goalEl = document.getElementById("goal");
      const timeEl = document.getElementById("time");
      const livesEl = document.getElementById("lives");
      const scoreEl = document.getElementById("score");
      const overlay = document.getElementById("overlay");
      const titleEl = document.getElementById("dialogTitle");
      const textEl = document.getElementById("dialogText");
      const startBtn = document.getElementById("startBtn");
      const recordForm = document.getElementById("recordForm");
      const nameInput = document.getElementById("nameInput");
      const saveBtn = document.getElementById("saveBtn");
      const board = document.getElementById("leaderboard");

      const state = {
        running: false, stage: 0, stageHits: 0, score: 0, lives: 0, remaining: 0,
        target: null, last: 0, action: null, saved: false
      };
      let width = 0;
      let height = 0;
      let scale = 1;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        scale = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = rect.height;
        canvas.width = Math.floor(width * scale);
        canvas.height = Math.floor(height * scale);
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
      }

      function leaderboard() {
        try {
          const records = JSON.parse(localStorage.getItem(storageKey) || "[]");
          return Array.isArray(records) ? records : [];
        } catch {
          return [];
        }
      }

      function renderBoard() {
        const records = leaderboard();
        board.innerHTML = "";
        if (!records.length) {
          board.innerHTML = "<li><span class=\"rank\">-</span><span class=\"entry-name\">还没有记录</span><span class=\"entry-score\">0</span></li>";
          return;
        }
        records.forEach((record, index) => {
          const item = document.createElement("li");
          item.innerHTML = "<span class=\"rank\">" + (index + 1) + "</span><span class=\"entry-name\"></span><span class=\"entry-score\"></span>";
          item.querySelector(".entry-name").textContent = record.name + " · 第" + record.level + "关";
          item.querySelector(".entry-score").textContent = record.score;
          board.appendChild(item);
        });
      }

      function updateHud() {
        const stage = stages[state.stage];
        levelBadge.textContent = "第 " + (state.stage + 1) + " 关 / " + stages.length;
        goalEl.textContent = state.stageHits + "/" + stage.goal;
        timeEl.textContent = Math.max(0, Math.ceil(state.remaining));
        livesEl.textContent = "●".repeat(state.lives) || "0";
        scoreEl.textContent = state.score;
      }

      function spawnTarget() {
        const stage = stages[state.stage];
        const gold = Math.random() < .18;
        const radius = gold ? stage.radius * .86 : stage.radius;
        const angle = Math.random() * Math.PI * 2;
        state.target = {
          x: radius + Math.random() * (width - radius * 2),
          y: radius + Math.random() * (height - radius * 2),
          radius, gold, points: gold ? 2 : 1,
          vx: Math.cos(angle) * stage.speed,
          vy: Math.sin(angle) * stage.speed,
          pulse: Math.random() * Math.PI * 2
        };
      }

      function showOverlay(title, text, buttonText, action, showRecord) {
        titleEl.textContent = title;
        textEl.textContent = text;
        startBtn.textContent = buttonText;
        state.action = action;
        recordForm.hidden = !showRecord;
        overlay.hidden = false;
      }

      function beginStage() {
        const stage = stages[state.stage];
        state.stageHits = 0;
        state.lives = stage.lives;
        state.remaining = stage.time;
        state.target = null;
        state.running = true;
        state.last = performance.now();
        overlay.hidden = true;
        updateHud();
        spawnTarget();
        requestAnimationFrame(loop);
      }

      function startRun() {
        state.stage = 0;
        state.score = 0;
        state.saved = false;
        nameInput.value = "";
        beginStage();
      }

      function finishRun(title, text) {
        state.running = false;
        state.target = null;
        state.saved = false;
        showOverlay(title, text, "再玩一次", startRun, true);
      }

      function clearStage() {
        state.running = false;
        state.target = null;
        if (state.stage === stages.length - 1) {
          finishRun("全部通关！", "你完成了五个关卡，总分 " + state.score + "。保存成绩后再挑战一次。");
          return;
        }
        state.stage += 1;
        showOverlay("关卡通过", "下一关目标更多、星点更小也更快。", "进入下一关", beginStage, false);
        updateHud();
      }

      function failStage(reason) {
        finishRun("挑战结束", reason + " 本次总分 " + state.score + "。保存记录后可以重新开始。");
      }

      function update(dt) {
        state.remaining -= dt;
        const target = state.target;
        if (target) {
          target.x += target.vx * dt;
          target.y += target.vy * dt;
          target.pulse += dt * 5;
          if (target.x - target.radius < 0 || target.x + target.radius > width) {
            target.vx *= -1;
            target.x = Math.max(target.radius, Math.min(width - target.radius, target.x));
          }
          if (target.y - target.radius < 0 || target.y + target.radius > height) {
            target.vy *= -1;
            target.y = Math.max(target.radius, Math.min(height - target.radius, target.y));
          }
        }
        if (state.remaining <= 0) {
          state.remaining = 0;
          state.stageHits >= stages[state.stage].goal ? clearStage() : failStage("本关目标没有完成。");
        }
        updateHud();
      }

      function drawTarget(target) {
        const color = target.gold ? "#ffd166" : "#55d6d3";
        const ring = target.radius + 8 + Math.sin(target.pulse) * 2;
        ctx.strokeStyle = target.gold ? "rgba(255, 209, 102, .35)" : "rgba(85, 214, 211, .34)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(target.x, target.y, ring, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#0b111a";
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.radius * .36, 0, Math.PI * 2);
        ctx.fill();
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#0b111a";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "rgba(150, 167, 194, .16)";
        for (let i = 0; i < 42; i++) {
          const x = (i * 79 + 31) % width;
          const y = (i * 137 + 19) % height;
          ctx.fillRect(x, y, i % 3 === 0 ? 2 : 1, i % 3 === 0 ? 2 : 1);
        }
        if (state.target) drawTarget(state.target);
      }

      function loop(now) {
        if (!state.running) { draw(); return; }
        const dt = Math.min(.034, (now - state.last) / 1000);
        state.last = now;
        update(dt);
        draw();
        if (state.running) requestAnimationFrame(loop);
      }

      function pointFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (width / rect.width),
          y: (event.clientY - rect.top) * (height / rect.height)
        };
      }

      canvas.addEventListener("pointerdown", (event) => {
        if (!state.running || !state.target) return;
        const point = pointFromEvent(event);
        const target = state.target;
        const hit = Math.hypot(point.x - target.x, point.y - target.y) <= target.radius;
        if (hit) {
          state.stageHits += target.points;
          state.score += target.points * (20 + state.stage * 8);
          if (state.stageHits >= stages[state.stage].goal) clearStage();
          else spawnTarget();
        } else {
          state.lives -= 1;
          if (state.lives <= 0) failStage("生命耗尽。");
        }
        updateHud();
      });

      startBtn.addEventListener("click", () => {
        if (typeof state.action === "function") state.action();
      });

      saveBtn.addEventListener("click", () => {
        if (state.saved) return;
        const name = (nameInput.value.trim() || "玩家").slice(0, 12);
        const records = leaderboard();
        records.push({ name, score: state.score, level: state.stage + 1 });
        records.sort((a, b) => b.score - a.score || b.level - a.level);
        localStorage.setItem(storageKey, JSON.stringify(records.slice(0, 5)));
        state.saved = true;
        saveBtn.textContent = "已保存";
        renderBoard();
      });

      window.addEventListener("resize", () => {
        resize();
        draw();
      });

      resize();
      renderBoard();
      updateHud();
      draw();
      showOverlay(
        "准备闯关",
        "点击或轻触移动的星点。蓝色目标 1 分，金色目标 2 分；点空会损失生命。",
        "开始游戏",
        startRun,
        false
      );
    })();
  </script>
</body>
</html>
