<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方仓 · 立体推箱子</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e8edf0;color:#243438;font:14px system-ui}button,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #bac8cb;background:#fff;border-radius:6px;min-height:44px;padding:10px}button:disabled{opacity:.4}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff}h1{font-size:22px;margin:0}small{color:#607477}main{position:relative;height:calc(100dvh - 76px);min-height:540px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.bar{position:absolute;top:18px;left:24px;right:24px;display:flex;gap:12px;align-items:center;pointer-events:none}.bar>*{pointer-events:auto}select{padding:12px;background:white;border:1px solid #bac8cb;border-radius:6px}.stats{display:flex;gap:24px;background:white;padding:12px 18px;border-radius:6px}.tools{margin-left:auto;display:flex;gap:8px}.tools button{width:46px;display:grid;place-items:center}svg{width:20px;height:20px}.pad{position:absolute;bottom:26px;right:28px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:5px}.pad button{font-size:25px;font-weight:bold;box-shadow:0 3px 0 #b2c5c7}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-row:2}.pad button:nth-child(3){grid-row:2}.pad button:nth-child(4){grid-row:2}.note{position:absolute;bottom:34px;left:24px;max-width:calc(100% - 240px);font-size:14px;color:#466365}.badge{color:#08725e;font-weight:700}dialog{border:1px solid #c6d1d1;border-radius:8px;padding:28px;width:min(360px,90vw);text-align:center}dialog::backdrop{background:#18313277}dialog h2{margin-top:0}.primary{background:#087967;color:#fff;border-color:#087967;width:100%;margin-top:12px}.error{position:absolute;inset:30% 20%;background:white;padding:24px;display:none}@media(max-width:600px){header{padding:10px 14px;height:66px}h1{font-size:20px}main{height:calc(100dvh - 66px)}.bar{left:10px;right:10px;top:10px;gap:6px;flex-wrap:wrap}.stats{padding:10px;gap:14px}.tools{gap:4px}.tools button{width:40px;min-height:40px;padding:8px}select{max-width:150px}.pad{bottom:26px;right:18px}.note{left:14px;bottom:40px;font-size:12px;max-width:calc(100% - 210px)}}
</style><header><div><h1>方仓</h1><small>立体推箱子</small></div><span class="badge">SOKOBAN / 3D</span></header><main><canvas id="scene"></canvas><div class="bar"><select id="levels" aria-label="选择关卡"></select><div class="stats"><span>步数 <b id="moves">0</b></span><span>归位 <b id="goals">0/1</b></span></div><div class="tools"><button id="undo" title="撤销 (Z)" aria-label="撤销"><i data-lucide="undo-2"></i></button><button id="reset" title="重置本关" aria-label="重置"><i data-lucide="rotate-ccw"></i></button><button id="view" title="恢复视角" aria-label="恢复视角"><i data-lucide="scan"></i></button></div></div><p id="note" class="note">将所有木箱推到绿色标记上</p><div class="pad"><button data-dir="0,-1" aria-label="向北">↑</button><button data-dir="-1,0" aria-label="向西">←</button><button data-dir="0,1" aria-label="向南">↓</button><button data-dir="1,0" aria-label="向东">→</button></div><div class="error" id="error">3D 组件加载失败，请刷新页面重试。</div></main><dialog id="win"><h2>仓库整理完成</h2><p id="result"></p><button class="primary" id="next">下一关</button><button id="stay" style="margin-top:8px;width:100%">查看棋盘</button></dialog>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script><script>window.addEventListener('error',()=>document.getElementById('error').style.display='block');window.lucide?.createIcons();</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const maps=[
['#####','# @ #','# $ #','# . #','#####'],
['######','#    #','# .$@#','#    #','######'],
['#######','#  .  #','#  $  #','# $@. #','#     #','#######'],
['#######','# . . #','# $ $ #','#  #  #','#  @  #','#######'],
['########','# .  . #','# $  $ #','#  ##  #','#   @  #','#      #','########'],
['#######','#  .  #','# $$  #','# .#. #','# $ @ #','#     #','#######'],
['########','# . .  #','#  $ $ #','# # #  #','# . $@ #','#      #','########'],
['########','# . . .#','# $ $ $#','#  #   #','# . $  #','#   @  #','########']];
const names=['第一件货物','绕到箱子背后','双箱调度','中央隔墙','两侧通道','三箱交错','窄道周转','总仓验收'];
let index=0,player,boxes,targets,walls,floors,history=[],complete=false,unlocked=1,best={};try{const s=JSON.parse(localStorage.getItem('fangcang-v1')||'{}');unlocked=Math.max(1,Math.min(8,s.unlocked||1));best=s.best||{};}catch{}
const $=id=>document.getElementById(id),key=(x,z)=>x+','+z;let group=new THREE.Group(),boxMeshes=[],avatar,animTime=0;
const renderer=new THREE.WebGLRenderer({canvas:$('scene'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setClearColor(0xe8edf0);const scene=new THREE.Scene();scene.add(group);const camera=new THREE.OrthographicCamera();scene.add(new THREE.HemisphereLight(0xffffff,0x718c82,2.2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-5,12,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);
const materials={floor:new THREE.MeshStandardMaterial({color:0xf8faf5,roughness:.9}),wall:new THREE.MeshStandardMaterial({color:0x658a98,roughness:.7}),box:new THREE.MeshStandardMaterial({color:0xdb9d49,roughness:.65}),band:new THREE.MeshStandardMaterial({color:0x966239}),goal:new THREE.MeshStandardMaterial({color:0x21b293,emissive:0x086244,emissiveIntensity:.3}),player:new THREE.MeshStandardMaterial({color:0xd95567,roughness:.5})};
function mesh(geometry,mat,x,y,z,parent=group){const m=new THREE.Mesh(geometry,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function save(){try{localStorage.setItem('fangcang-v1',JSON.stringify({unlocked,best}));}catch{}}
function options(){ $('levels').innerHTML=names.map((n,i)=>`<option value="${i}" ${i+1>unlocked?'disabled':''}>${i+1}. ${n}${best[i]!=null?' ✓':''}</option>`).join('');$('levels').value=index;}
function load(i){index=i;history=[];complete=false;walls=new Set();floors=new Set();targets=new Set();boxes=[];maps[i].forEach((row,z)=>[...row].forEach((c,x)=>{if(c==='#')walls.add(key(x,z));else if(c!==' '||x>0){floors.add(key(x,z));if(c==='@')player={x,z};if(c==='$')boxes.push({x,z});if(c==='.')targets.add(key(x,z));}}));$('win').close();rebuild();options();hud();home();}
function rebuild(){group.traverse(o=>o.geometry?.dispose());scene.remove(group);group=new THREE.Group();scene.add(group);const w=maps[index][0].length,h=maps[index].length;group.position.set(-(w-1)/2,0,-(h-1)/2);walls.forEach(k=>{const [x,z]=k.split(',').map(Number);mesh(new THREE.BoxGeometry(.96,.45,.96),materials.wall,x,.05,z);});floors.forEach(k=>{const [x,z]=k.split(',').map(Number);mesh(new THREE.BoxGeometry(.97,.18,.97),materials.floor,x,-.28,z);if(targets.has(k)){const t=mesh(new THREE.TorusGeometry(.28,.048,8,32),materials.goal,x,-.175,z);t.rotation.x=Math.PI/2;}});boxMeshes=boxes.map(b=>{const g=new THREE.Group();group.add(g);g.position.set(b.x,0,b.z);mesh(new THREE.BoxGeometry(.7,.7,.7),materials.box,0,.18,0,g);for(const x of [-.23,.23])mesh(new THREE.BoxGeometry(.065,.74,.74),materials.band,x,.18,0,g);return g;});avatar=new THREE.Group();group.add(avatar);avatar.position.set(player.x,0,player.z);mesh(new THREE.CylinderGeometry(.2,.25,.36,24),materials.player,0,.04,0,avatar);mesh(new THREE.SphereGeometry(.21,24,16),materials.player,0,.36,0,avatar);mesh(new THREE.BoxGeometry(.22,.06,.06),materials.floor,0,.39,-.19,avatar);}
function hud(){const count=boxes.filter(b=>targets.has(key(b.x,b.z))).length;$('moves').textContent=history.length;$('goals').textContent=count+'/'+boxes.length;$('undo').disabled=!history.length;complete=count===boxes.length;if(complete){best[index]=Math.min(best[index]??Infinity,history.length);unlocked=Math.max(unlocked,Math.min(8,index+2));save();options();$('result').textContent=`第 ${index+1} 关 · ${history.length} 步 · 最佳 ${best[index]} 步`;$('next').textContent=index===7?'从第一关再挑战':'下一关';$('win').showModal();}else{const stuck=boxes.some(b=>!targets.has(key(b.x,b.z))&&(walls.has(key(b.x-1,b.z))||walls.has(key(b.x+1,b.z)))&&(walls.has(key(b.x,b.z-1))||walls.has(key(b.x,b.z+1))));$('note').textContent=stuck?'木箱进入死角，可撤销上一步':'将所有木箱推到绿色标记上';}}
function move(dx,dz){if(complete||$('win').open)return;const x=player.x+dx,z=player.z+dz;if(!floors.has(key(x,z)))return;const b=boxes.find(b=>b.x===x&&b.z===z);if(b&&(!floors.has(key(x+dx,z+dz))||boxes.some(q=>q.x===x+dx&&q.z===z+dz)))return;history.push({player:{...player},boxes:boxes.map(b=>({...b}))});if(b){b.x+=dx;b.z+=dz;}player={x,z};hud();}
let angle=0,drag=null;function home(){angle=0;resize();}function resize(){const r=$('scene').getBoundingClientRect();renderer.setSize(r.width,r.height,false);const aspect=r.width/r.height;const extent=Math.max(maps[index].length+2,(maps[index][0].length+2)/aspect)/2;camera.left=-extent*aspect;camera.right=extent*aspect;camera.top=extent;camera.bottom=-extent;camera.near=.1;camera.far=100;camera.position.set(Math.sin(angle)*11,13,Math.cos(angle)*11);camera.lookAt(0,0,0);camera.updateProjectionMatrix();}
$('scene').addEventListener('pointerdown',e=>{drag={x:e.clientX,a:angle};$('scene').setPointerCapture(e.pointerId);});$('scene').addEventListener('pointermove',e=>{if(drag){angle=Math.max(-.7,Math.min(.7,drag.a+(e.clientX-drag.x)*.004));resize();}});$('scene').addEventListener('pointerup',()=>drag=null);$('scene').addEventListener('pointercancel',()=>drag=null);
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(...b.dataset.dir.split(',').map(Number)));$('undo').onclick=()=>{const s=history.pop();if(s){player=s.player;boxes=s.boxes;complete=false;$('win').close();hud();}};$('reset').onclick=()=>{if(history.length&&!confirm('重置本关的所有移动？'))return;load(index);};$('view').onclick=home;$('levels').onchange=e=>load(+e.target.value);$('next').onclick=()=>load((index+1)%8);$('stay').onclick=()=>$('win').close();window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||$('win').open)return;const d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d);}if(e.key==='z')$('undo').click();});window.addEventListener('resize',resize);load(0);function animate(t){const dt=Math.min(.05,(t-animTime)/1000||0);animTime=t;const f=1-Math.exp(-18*dt);avatar.position.x+=(player.x-avatar.position.x)*f;avatar.position.z+=(player.z-avatar.position.z)*f;boxMeshes.forEach((m,i)=>{m.position.x+=(boxes[i].x-m.position.x)*f;m.position.z+=(boxes[i].z-m.position.z)*f;});renderer.render(scene,camera);requestAnimationFrame(animate);}requestAnimationFrame(animate);
</script></html>
