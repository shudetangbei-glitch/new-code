*{box-sizing:border-box}body{margin:0;background:#102528;color:#f2fbf6;font:14px system-ui}button,select{font:inherit;color:inherit;cursor:pointer;background:#193c40;border:1px solid #638184;border-radius:6px;padding:10px;min-height:44px}button:disabled{opacity:.35}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid #466366}h1{font-size:22px;margin:0}small{color:#9bc3c1}.brand{color:#bdfb77;font-weight:700}main{position:relative;height:calc(100dvh - 72px);min-height:540px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.bar{position:absolute;top:18px;left:24px;right:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;pointer-events:none}.bar>*{pointer-events:auto}.stats{display:flex;gap:20px;padding:10px;color:#eaffee}.tools{margin-left:auto;display:flex;gap:6px}.tools button{width:44px;display:grid;place-items:center}svg{width:20px;height:20px}.pad{position:absolute;bottom:24px;right:24px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:5px}.pad button{font-size:24px;background:#204a4e;box-shadow:0 3px 0 #071b1d}.pad button:first-child{grid-column:2}.pad button:nth-child(n+2){grid-row:2}.note{position:absolute;left:24px;bottom:28px;max-width:calc(100% - 235px);color:#c4ded6;line-height:1.7}.chapter{color:#bdfb77;font-size:12px;letter-spacing:0}.error{display:none;position:absolute;inset:30% 15%;background:#263e42;padding:24px}dialog{background:#193c40;color:white;border:1px solid #9bcbba;border-radius:8px;padding:28px;width:min(360px,90vw);text-align:center}dialog::backdrop{background:#031416bb}.primary{background:#c5f789;color:#15322a;width:100%;margin:12px 0 8px}#stay{width:100%}@media(max-width:600px){header{height:66px;padding:10px 14px}h1{font-size:20px}.brand{font-size:12px}main{height:calc(100dvh - 66px)}.bar{top:10px;left:10px;right:10px;gap:4px}select{max-width:175px}.stats{gap:10px;padding:8px}.tools{width:100%;justify-content:flex-end}.pad{right:14px;bottom:22px}.note{left:14px;max-width:calc(100% - 195px);font-size:12px}}
</style><header><div><h1>方仓 · 机关浮岛</h1><small>FLOATING ISLES</small></div><span class="brand">立体机关 / 08 关</span></header><main><canvas id="scene"></canvas><div class="bar"><select id="levels" aria-label="关卡"></select><div class="stats"><span>步数 <b id="moves">0</b></span><span>核心 <b id="goals">0/1</b></span></div><div class="tools"><button id="undo" title="撤销" aria-label="撤销"><i data-lucide="undo-2"></i></button><button id="reset" title="重置本关" aria-label="重置"><i data-lucide="rotate-ccw"></i></button><button id="view" title="恢复视角" aria-label="恢复视角"><i data-lucide="scan"></i></button></div></div><div class="note"><div class="chapter" id="chapter"></div><span id="note"></span></div><div class="pad"><button data-dir="0,-1" aria-label="向北">↑</button><button data-dir="-1,0" aria-label="向西">←</button><button data-dir="0,1" aria-label="向南">↓</button><button data-dir="1,0" aria-label="向东">→</button></div><div id="error" class="error">场景加载失败，请刷新重试。</div></main><dialog id="win"><h2>浮岛核心已点亮</h2><p id="result"></p><button id="next" class="primary">下一关</button><button id="stay">留在浮岛</button></dialog>
<script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" onload="lucide.createIcons()"></script><script>window.addEventListener('error',()=>document.getElementById('error').style.display='block');</script>
<script id="core">
const levels=[
{name:'01 · 启动桥梁',hint:'琥珀核心 → 压住后浮桥升起',map:['#########','# @ $A  #','#       #','####=####','#       #','#  $ .  #','#########']},
{name:'02 · 远端投送',hint:'蓝色传送门 → 玩家与箱子均可穿越',map:['########','#@ $ o #','#  #   #','###### #','# o  . #','#      #','########']},
{name:'03 · 双箱交错',hint:'先留出绕行的空间',map:['#######','#  .  #','# $$  #','# .#. #','# $ @ #','#     #','#######']},
{name:'04 · 桥上调度',hint:'桥上有人或箱子时，桥保持升起',map:['#########','#  A    #','# $   $ #','#   @   #','####=####','# .     #','#       #','#       #','#########']},
{name:'05 · 折返传送',hint:'传送出口被占用时，入口无法进入',map:['#########','# .  o  #','# $ # $ #','#   @   #','# # # # #','# o   . #','#########']},
{name:'06 · 四核仓库',hint:'不要让箱子堵住自己的退路',map:['########','# . . .#','# $ $ $#','#  #   #','# . $  #','#   @  #','########']},
{name:'07 · 跨岛协作',hint:'先启动机关，再安排运送顺序',map:['#########','# A     #','# $ $ @ #','#       #','####=####','# o   . #','#  $    #','# . o   #','#########']},
{name:'08 · 中枢重启',hint:'四座核心，桥梁与传送门联动',map:['#########','# . A   #','# $ $   #','#   @   #','####=####','#.  o . #','# $ #   #','# o  $  #','#       #','#########']}];
const K=(x,z)=>x+','+z;
function parseLevel(i){const floor=new Set(),goals=new Set(),switches=new Set(),bridges=new Set(),portals=[];let p,b=[];levels[i].map.forEach((r,z)=>[...r].forEach((c,x)=>{if(c==='#')return;const k=K(x,z);floor.add(k);if(c==='@')p={x,z};if(c==='$')b.push({x,z});if(c==='.'||c==='A')goals.add(k);if(c==='a'||c==='A')switches.add(k);if(c==='=')bridges.add(k);if(c==='o')portals.push({x,z});}));return {floor,goals,switches,bridges,portals,initial:{p,b}};}
function bridgeOn(l,s){return [s.p,...s.b].some(v=>l.switches.has(K(v.x,v.z))||l.bridges.has(K(v.x,v.z)));}
function step(l,s,dx,dz){const open=bridgeOn(l,s),occupied=(x,z,skip=-1)=>s.b.some((b,i)=>i!==skip&&b.x===x&&b.z===z);function dest(x,z,skip=-1){if(!l.floor.has(K(x,z))||(!open&&l.bridges.has(K(x,z)))||occupied(x,z,skip))return null;const n=l.portals.findIndex(p=>p.x===x&&p.z===z);if(n>=0){const q=l.portals[1-n];if(!q||occupied(q.x,q.z,skip)||(q.x===s.p.x&&q.z===s.p.z&&skip>=0))return null;return {...q};}return {x,z};}const x=s.p.x+dx,z=s.p.z+dz,bi=s.b.findIndex(b=>b.x===x&&b.z===z);const b=s.b.map(v=>({...v}));if(bi>=0){const q=dest(x+dx,z+dz,bi);if(!q)return null;b[bi]=q;}else if(!dest(x,z))return null;const p=bi>=0?{x,z}:dest(x,z);if(b.some(q=>q.x===p.x&&q.z===p.z))return null;return {p,b};}
function solved(l,s){return s.b.every(b=>l.goals.has(K(b.x,b.z)));}
</script>
<script type="module">
async function engine(){try{return await Promise.race([import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'),new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),8000))]);}catch{return import('https://unpkg.com/three@0.180.0/build/three.module.js');}}
const T=await engine().catch(e=>{document.getElementById('error').style.display='block';throw e;});
const $=id=>document.getElementById(id),renderer=new T.WebGLRenderer({canvas:$('scene'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
const scene=new T.Scene();scene.background=new T.Color('#102528');scene.fog=new T.Fog('#102528',25,65);const camera=new T.PerspectiveCamera(40,1,.1,120);scene.add(new T.HemisphereLight(0xbdedff,0x16382a,2));const sun=new T.DirectionalLight(0xffedbb,4);sun.position.set(-8,16,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-15,right:15,top:15,bottom:-15});scene.add(sun);const rim=new T.DirectionalLight(0x64f5e3,3);rim.position.set(6,4,-8);scene.add(rim);
const mat=(color,metalness=0,emissive=0)=>new T.MeshStandardMaterial({color,roughness:.45,metalness,emissive,emissiveIntensity:.8});const m={floor:mat(0x538d85,.2),rock:mat(0x213f46),wall:mat(0x35626a,.3),box:mat(0xf3bb50,.55),edge:mat(0x62492f,.5),goal:mat(0xbaff83,.2,0x539f23),portal:mat(0x58d8ff,.5,0x26aadd),switch:mat(0xff9853,.3,0xad3c0a),player:mat(0xef6389,.4),white:mat(0xe3ffff,.2,0x54aa99)};
let group,avatar,boxMeshes=[],rings=[],bridgeMeshes=[],plateMeshes=[],index=0,l,s,history=[],complete=false,angle=.38,drag,unlocked=1,best={};try{const v=JSON.parse(localStorage.getItem('fangcang-isles-v2')||'{}');unlocked=Math.max(1,Math.min(8,Number(v.unlocked)||1));best=v.best||{};}catch{}
function mesh(g,material,x,y,z,parent=group){const o=new T.Mesh(g,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;}
function box(w,h,d,material,x,y,z,parent){return mesh(new T.BoxGeometry(w,h,d),material,x,y,z,parent);}
function build(){if(group){group.traverse(o=>o.geometry?.dispose());scene.remove(group);}group=new T.Group();scene.add(group);group.position.set(-(levels[index].map[0].length-1)/2,0,-(levels[index].map.length-1)/2);rings=[];bridgeMeshes=[];plateMeshes=[];l.floor.forEach(k=>{const [x,z]=k.split(',').map(Number);if(l.bridges.has(k)){const g=new T.Group();group.add(g);g.position.set(x,0,z);for(let i=0;i<5;i++)box(.96,.17,.16,m.box,0,-.1,-.4+i*.2,g);bridgeMeshes.push(g);return;}box(.97,.3,.97,m.floor,x,-.2,z);const depth=1.1+((x*7+z*3)%5)*.16;box(.86,depth,.86,m.rock,x,-.4-depth/2,z);if(l.goals.has(k)){const r=mesh(new T.TorusGeometry(.3,.055,10,36),m.goal,x,.03,z);r.rotation.x=Math.PI/2;rings.push(r);box(.38,.03,.38,m.goal,x,-.035,z);}if(l.switches.has(k)){plateMeshes.push(box(.65,.09,.65,m.switch,x,.02,z));}if(l.portals.some(p=>p.x===x&&p.z===z)){for(let j=0;j<2;j++){const r=mesh(new T.TorusGeometry(.33+j*.06,.025,8,40),m.portal,x,.03+j*.1,z);r.rotation.x=Math.PI/2;rings.push(r);}box(.32,.03,.32,m.portal,x,-.02,z);}});
levels[index].map.forEach((r,z)=>[...r].forEach((c,x)=>{if(c!=='#')return;if(![[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dz])=>l.floor.has(K(x+dx,z+dz))))return;box(.95,.65,.95,m.wall,x,-.1,z);box(.97,.06,.97,m.floor,x,.245,z);}));
boxMeshes=s.b.map(b=>{const g=new T.Group();group.add(g);g.position.set(b.x,0,b.z);box(.68,.68,.68,m.box,0,.36,0,g);for(const x of [-.24,.24])box(.055,.73,.73,m.edge,x,.36,0,g);box(.32,.04,.32,m.white,0,.72,0,g);return g;});avatar=new T.Group();group.add(avatar);avatar.position.set(s.p.x,0,s.p.z);mesh(new T.CapsuleGeometry(.19,.3,8,16),m.player,0,.36,0,avatar);box(.27,.12,.13,m.white,0,.55,-.16,avatar);for(const x of [-.12,.12])box(.14,.12,.22,m.rock,x,.06,0,avatar);
for(let j=0;j<12;j++){const a=j*2.4,d=10+j%3*3;const rock=mesh(new T.OctahedronGeometry(.3+(j%3)*.2),m.rock,Math.sin(a)*d,-4-j%4,Math.cos(a)*d);rock.rotation.set(j,j*.3,0);}}
function opts(){$('levels').innerHTML=levels.map((v,i)=>`<option value="${i}" ${i>=unlocked?'disabled':''}>${v.name}${best[i]!=null?' ✓':''}</option>`).join('');$('levels').value=index;}
function load(i){index=i;l=parseLevel(i);s=l.initial;history=[];complete=false;$('win').close();build();opts();hud();resize();}
function hud(){$('moves').textContent=history.length;$('goals').textContent=s.b.filter(b=>l.goals.has(K(b.x,b.z))).length+'/'+s.b.length;$('undo').disabled=!history.length;$('chapter').textContent=levels[index].name;$('note').textContent=levels[index].hint;const now=solved(l,s);if(now&&!complete){complete=true;unlocked=Math.max(unlocked,Math.min(8,index+2));best[index]=Math.min(best[index]??Infinity,history.length);try{localStorage.setItem('fangcang-isles-v2',JSON.stringify({unlocked,best}));}catch{}opts();$('result').textContent=`${history.length} 步完成 · 最佳 ${best[index]} 步`;$('next').textContent=index===7?'重新挑战':'下一座浮岛';$('win').showModal();}}
function move(dx,dz){if(complete||$('win').open)return;const n=step(l,s,dx,dz);if(n){history.push(s);s=n;hud();}}
function resize(){const r=$('scene').getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;const size=Math.max(levels[index].map.length,levels[index].map[0].length);const d=size*(camera.aspect<.7?3.15:camera.aspect<1?2.6:1.9);camera.position.set(Math.sin(angle)*d,d*.95,Math.cos(angle)*d);camera.lookAt(0,-.4,0);camera.updateProjectionMatrix();}
$('scene').onpointerdown=e=>{drag={x:e.clientX,a:angle};$('scene').setPointerCapture(e.pointerId);};$('scene').onpointermove=e=>{if(drag){angle=Math.max(-.65,Math.min(.65,drag.a+(e.clientX-drag.x)*.005));resize();}};$('scene').onpointerup=$('scene').onpointercancel=()=>drag=null;
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(...b.dataset.dir.split(',').map(Number)));$('undo').onclick=()=>{if(history.length){s=history.pop();complete=false;$('win').close();hud();}};$('reset').onclick=()=>{if(!history.length||confirm('重新开始本关？'))load(index);};$('view').onclick=()=>{angle=.38;resize();};$('levels').onchange=e=>load(+e.target.value);$('next').onclick=()=>load((index+1)%8);$('stay').onclick=()=>$('win').close();window.onkeydown=e=>{if(e.target.tagName==='SELECT'||$('win').open)return;const d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d);}if(e.key==='z')$('undo').click();};window.addEventListener('resize',resize);load(0);let prev=0;function animate(t){const dt=Math.min(.05,(t-prev)/1000||0);prev=t;const f=1-Math.exp(-15*dt);avatar.position.lerp(new T.Vector3(s.p.x,0,s.p.z),f);avatar.rotation.y=Math.sin(t*.001)*.08;boxMeshes.forEach((o,i)=>o.position.lerp(new T.Vector3(s.b[i].x,0,s.b[i].z),f));bridgeMeshes.forEach(o=>{o.position.y+=((bridgeOn(l,s)?0:-1.8)-o.position.y)*f;});plateMeshes.forEach(o=>{o.position.y+=(([s.p,...s.b].some(v=>v.x===o.position.x&&v.z===o.position.z)?-.04:.02)-o.position.y)*f;});rings.forEach((o,i)=>{o.rotation.z=t*.0007*(i%2?1:-1);o.scale.setScalar(1+Math.sin(t*.003+i)*.05);});renderer.render(scene,camera);requestAnimationFrame(animate);}requestAnimationFrame(animate);
</script></html>
