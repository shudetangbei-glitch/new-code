<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贝的小应用</title>
<meta name="description" content="所有小游戏和小工具的入口">
<link rel="manifest" href="home.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/home-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/home-192.png">
<link rel="apple-touch-icon" href="icons/home-180.png">
<meta name="apple-mobile-web-app-title" content="小应用">
<meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f4f0;
    --card: #ffffff;
    --text: #23211e;
    --muted: #7d7870;
    --border: #e6e1d8;
    --accent: #b08d57;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --card: #1e1d1b;
      --text: #ece8e1;
      --muted: #9a948a;
      --border: #2e2c29;
      --accent: #d2ad72;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 60px;
  }
  main { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  header h1 { font-size: 26px; margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .08em;
    margin: 28px 0 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  a.app {
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    transition: transform .15s, border-color .15s;
  }
  a.app:hover, a.app:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  a.app:active { transform: scale(.98); }
  .icon {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 12px;
    display: grid; place-items: center;
    font-size: 24px;
    background: var(--bg);
  }
  .name { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .desc { font-size: 13px; color: var(--muted); line-height: 1.4; }
</style>
</head>
<body>
<main>
  <header>
    <h1>贝的小应用</h1>
    <p>点开就能玩、就能用，手机电脑都可以</p>
  </header>

  <h2>小游戏</h2>
  <div class="grid">
    <a class="app" href="wonder-estate.html"><span class="icon"><img src="icons/wonder-estate-192.png" alt="" width="44" height="44" style="display:block;border-radius:12px"></span><span><div class="name">奇境地产局</div><div class="desc">3D 空中城市，2～4 人联机或同屏</div></span></a>
    <a class="app" href="star-raid.html"><span class="icon">🚀</span><span><div class="name">星际突围</div><div class="desc">3D 太空射击，升级战机闯关</div></span></a>
    <a class="app" href="sokoban-3d.html"><span class="icon">📦</span><span><div class="name">方仓 · 机关浮岛</div><div class="desc">3D 推箱子解谜</div></span></a>
    <a class="app" href="merge-defense.html"><span class="icon">🏰</span><span><div class="name">合成守城</div><div class="desc">部署、合成炮塔，守住敌潮</div></span></a>
    <a class="app" href="gear-factory.html"><span class="icon">⚙️</span><span><div class="name">齿轮工厂</div><div class="desc">选对齿轮，把动力送到机器</div></span></a>
    <a class="app" href="minesweeper.html"><span class="icon">💣</span><span><div class="name">扫雷</div><div class="desc">经典扫雷，带排行榜</div></span></a>
    <a class="app" href="2048.html"><span class="icon">🔢</span><span><div class="name">2048</div><div class="desc">划动合并数字</div></span></a>
    <a class="app" href="level-game.html"><span class="icon">🎯</span><span><div class="name">星点突围</div><div class="desc">点中星点，闯过五个关卡</div></span></a>
    <a class="app" href="game.html"><span class="icon">⭐</span><span><div class="name">接住星光</div><div class="desc">30 秒接星星、躲陨石</div></span></a>
  </div>

  <h2>小工具</h2>
  <div class="grid">
    <a class="app" href="daily-cheer.html"><span class="icon">💌</span><span><div class="name">每日暖心话</div><div class="desc">每天一句暖心的话</div></span></a>
    <a class="app" href="nearby.html"><span class="icon">📍</span><span><div class="name">附近推荐</div><div class="desc">吃饭、休闲、住宿，一键导航</div></span></a>
    <a class="app" href="outfit-colors.html"><span class="icon">👗</span><span><div class="name">穿搭配色工具</div><div class="desc">选主色和风格，看搭配</div></span></a>
  </div>
</main>
</body>
</html>
