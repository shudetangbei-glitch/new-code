name: Keep Supabase project alive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat row so Supabase sees real database activity
        run: |
          curl -sS -f -X POST \
            "https://jgfixbzsnblfcomjmxuc.supabase.co/rest/v1/keepalive?on_conflict=id" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"id\":1,\"pinged_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
        env:
          SUPABASE_KEY: sb_publishable_trShHiFmgx3kTz_1kZPKqQ_qzMbAQnl
